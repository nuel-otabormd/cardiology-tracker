<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardiology Fellowship Tracker — 2028</title>
<style>
/* ============================================================
   CARDIOLOGY FELLOWSHIP TRACKER — presentation layer
   Surface: dark stone. Layout: 3-pane command center + pipeline.
   ============================================================ */
*{box-sizing:border-box}
:root{
  --srf:#f0ede5; --srf2:#e3dfd4; --srf3:#fbf9f4; --srf4:#d1ccbe;
  --hair:#a39e8e; --hair2:#b9b4a4;
  --ink:#101114; --ink2:#313337; --ink3:#45463f;
  --accent:#1c3cbe; --gold:#7c5b07; --red:#a32f23; --redbg:#e7d2cd;
  --tA:#0a6e3e; --tB:#15619c; --tC:#8f5c05; --tD:#5f6065;
  --imS:#0a6e3e; --imM:#8f5c05; --imR:#94470f; --imRr:#a32f23; --imU:#45463f;
  --inp:#efece5;
}
html,body{height:100%}
body{margin:0;background:#222326;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit}
.shell{height:100vh;max-width:100%;margin:0 auto;background:var(--srf);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
@media(min-width:1520px){.shell{border-left:1px solid #4a4b4e;border-right:1px solid #4a4b4e}}

/* ---------- topbar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--hair);background:var(--srf2);flex-wrap:wrap}
.top .t{font-size:14.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.top .t span{color:var(--ink3);font-weight:400;margin-left:7px;font-size:13px}
.tabs{display:flex;gap:2px;background:var(--srf4);border-radius:6px;padding:2px}
.tab{border:none;background:none;font-size:12.5px;font-weight:600;color:var(--ink2);border-radius:5px;padding:5px 13px;cursor:pointer}
.tab.on{background:var(--srf3);color:var(--ink);box-shadow:0 1px 2px rgba(30,30,30,.15)}
.search{flex:1;min-width:140px;max-width:320px;border:1px solid var(--hair);border-radius:5px;padding:6px 10px;font:inherit;font-size:13px;background:var(--srf3);color:var(--ink)}
.search::placeholder{color:var(--ink3)}
.search:focus{outline:none;border-color:var(--accent)}
.meters{margin-left:auto;display:flex;gap:18px;align-items:center}
.meter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.meter b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:650}
.meter.warn b{color:var(--red)}
.mbar{width:78px;height:5px;background:var(--srf4);border-radius:3px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent);transition:width .15s}
.meter.warn .mbar i{background:var(--red)}
.btn{font-size:12.5px;font-weight:550;border:1px solid var(--hair);background:var(--srf3);color:var(--ink2);border-radius:5px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--ink3)}

/* ---------- panes ---------- */
.panes{display:grid;grid-template-columns:var(--w-side,200px) 6px minmax(260px,1fr) 6px var(--w-det,390px);min-height:0}
.panes.noside{grid-template-columns:minmax(260px,1fr) 6px var(--w-det,390px)}
.panes.noside .side,.panes.noside #rzSide{display:none}
.rz{cursor:col-resize;background:linear-gradient(to right,transparent 0,transparent 2.5px,var(--hair) 2.5px,var(--hair) 3.5px,transparent 3.5px)}
.rz:hover,.rz.act{background:var(--accent)}
.dexp{float:right;margin-left:10px}
.panes.boardmode{display:none}

/* sidebar */
.side{background:var(--srf2);padding:12px 0 20px;overflow-y:auto}
.sh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700;padding:6px 18px 5px}
.sv{display:flex;align-items:center;gap:8px;padding:6px 18px;font-size:13px;color:var(--ink2);cursor:pointer;font-weight:500;border:none;background:none;width:100%;text-align:left}
.sv:hover{background:var(--srf4)}
.sv.sel{background:var(--srf4);color:var(--ink);font-weight:650;box-shadow:inset 2px 0 0 var(--accent)}
.sv .c{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sv .c b{color:var(--ink2);font-weight:650}
.sv.warnc .c b{color:var(--red)}
.gap{height:14px}
.dv{display:flex;align-items:center;gap:8px;padding:5px 18px;font-size:12.5px;color:var(--ink2);cursor:pointer;border:none;background:none;width:100%;text-align:left}
.dv:hover{background:var(--srf4)}
.dv.flt{background:var(--srf4);box-shadow:inset 2px 0 0 var(--ink2)}
.dv .pickwrap{width:28px;height:28px;margin:-6px 0 -6px -6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;border-radius:50%}
.dv .pickwrap:hover{background:var(--srf4)}
.dv .pick{width:18px;height:18px;border:1.5px solid var(--ink3);border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:transparent;flex:0 0 auto;background:var(--srf3);pointer-events:none}
.dv:not(.on) .pick::after{content:"+";color:var(--ink3);font-weight:700;font-size:11.5px;line-height:1}
.dv:not(.on):hover .pick{border-color:var(--gold)}
.dv:not(.on):hover .pick::after{color:var(--gold)}
.dv.on .pick{background:var(--gold);border-color:var(--gold);color:#fff}
.dv .c{margin-left:auto;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.dv.on{color:var(--ink);font-weight:600}
.sfoot{padding:12px 18px 4px;font-size:11px;color:var(--ink3);line-height:1.5}

/* list */
.list{overflow-y:auto;min-width:0;background:var(--srf);outline:none}
.lt{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--hair2);position:sticky;top:0;background:var(--srf);z-index:2;flex-wrap:wrap}
.lt .n{font-size:12px;color:var(--ink2);font-weight:600;margin-right:auto;white-space:nowrap}
.divchip{color:var(--accent);cursor:pointer;font-weight:650}
.lt select{font:inherit;font-size:11.5px;color:var(--ink2);border:1px solid var(--hair2);border-radius:4px;padding:3px 3px;background:var(--srf3);max-width:118px}
.gh{padding:13px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:750}
.gh b{color:var(--ink2)}
.r{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;border-bottom:1px solid var(--hair2)}
.r:hover{background:var(--srf3)}
.r.sel{background:var(--srf3);box-shadow:inset 2px 0 0 var(--accent)}
.r.dim{opacity:.55}
.r .sq{width:9px;height:9px;border-radius:2.5px;flex:0 0 auto}
.sq.A{background:var(--tA)}.sq.B{background:var(--tB)}.sq.C{background:var(--tC)}.sq.D{background:var(--tD)}
.sq.cS{background:#1d9e57}.sq.cM{background:#e3a90e}.sq.cR{background:#e06d1f}.sq.cRr{background:#cc3a2e}.sq.cU{background:#9b9b95}
.r .main{min-width:0;flex:1}
.r .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .nm .hm{color:var(--accent);font-size:10px;font-weight:800;margin-left:6px;letter-spacing:.04em}
.r .nm .ov{color:var(--ink3);font-weight:500;font-size:11px;margin-left:5px}
.r .lo{font-size:12px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .lo .cn{color:var(--gold);font-weight:600}
.r .im{font-size:11.5px;font-weight:600;width:98px;flex:0 0 auto;display:flex;align-items:center;gap:7px}
.r .im b{width:13px;text-align:center;color:var(--ink2);font-weight:750;flex:0 0 auto;font-size:11px}
.imS{color:var(--imS)}.imM{color:var(--imM)}.imR{color:var(--imR)}.imRr{color:var(--imRr)}.imU{color:var(--imU)}
.r .gl{display:flex;gap:5px;width:54px;justify-content:flex-end;flex:0 0 auto;font-size:11.5px;align-items:center}
.gl .s{color:#fff;background:var(--accent);border-radius:3px;font-size:9px;font-weight:800;padding:2px 4px;letter-spacing:.04em}
.gl .st{color:var(--gold)}
.gl .re{color:var(--tA);font-weight:800}
.empty{padding:40px 20px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.6}

/* detail */
.det{overflow-y:auto;background:var(--srf3);padding:18px 22px 36px}
.det .ttl{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.det .sub{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.det .sub,.fa .v.mut{color:var(--ink2)}
.det .sub a{color:var(--accent);text-decoration:none;font-weight:550}
.det .sub a:hover{text-decoration:underline}
.dacts{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.da{font-size:12.5px;font-weight:600;border:1px solid var(--hair);background:var(--srf);color:var(--ink2);border-radius:5px;padding:7px 12px;cursor:pointer}
.da:hover{border-color:var(--ink3);color:var(--ink)}
.da.sigon{background:var(--accent);border-color:var(--accent);color:#fff}
.da.staron{background:var(--srf);border-color:var(--gold);color:var(--gold)}
.da.reachon{background:var(--tA);border-color:var(--tA);color:#fff}
.da.rm{margin-left:auto;color:var(--red);border-color:#c5a59d}
.da.rest{margin-left:auto;color:var(--tA);border-color:#9dbfa8}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--hair2);border:1px solid var(--hair2);border-radius:7px;overflow:hidden;margin:16px 0 0}
.fa{background:var(--srf3);padding:9px 12px;min-width:0}
.fa .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700}
.fa .v{font-size:14px;font-weight:600;margin-top:4px;overflow-wrap:break-word}
.fa .v.mut{font-weight:500;color:var(--ink2)}
.fa .v small{font-size:10.5px;color:var(--ink3);font-weight:500}
.fa select{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--hair);border-radius:4px;background:var(--srf);padding:2px 3px;color:var(--ink)}
.fa .yours{font-size:10px;color:var(--gold);font-weight:700;margin-left:5px}
.conn{margin:16px 0 0;border-left:2px solid var(--gold);padding:2px 0 2px 12px}
.conn .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);font-weight:800}
.conn .v{font-size:13px;line-height:1.55;margin-top:3px}
.dsec{margin:18px 0 0}
.dsec .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;margin-bottom:5px}
.dsec .v{font-size:13.5px;line-height:1.65;color:var(--ink)}
.field{margin:16px 0 0}
.field .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.field .saved{color:var(--tA);font-weight:700;font-size:10px;opacity:0;transition:opacity .3s}
.field .saved.show{opacity:1}
.field input[type=text],.field textarea{width:100%;border:1px solid var(--hair);border-radius:6px;padding:8px 10px;font:inherit;font-size:13px;background:var(--inp);resize:vertical;color:var(--ink)}
.field textarea{min-height:64px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.det .none{color:var(--ink3);font-size:13px;padding:60px 10px;text-align:center;line-height:1.6}

/* ---------- pipeline board ---------- */
.board{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--hair);min-height:0;overflow:hidden}
.board.on{display:grid}
.col{background:var(--srf);display:flex;flex-direction:column;min-height:0}
.col.over{background:var(--srf3)}
.colh{padding:12px 14px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:750;color:var(--ink2);display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--hair2);flex:0 0 auto}
.colh .c{margin-left:auto;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:600}
.colh.ballot{color:var(--accent)}
.colh.ballot .c b{color:var(--accent)}
.colh.ballot.warn,.colh.ballot.warn .c b{color:var(--red)}
.colbody{overflow-y:auto;padding:0 0 16px;flex:1}
.bslots{padding:9px 14px 0;font-size:11px;color:var(--ink3)}
.slotbar{display:flex;gap:2.5px;margin-top:5px}
.slot{flex:1;height:7px;border-radius:2px;background:var(--srf4)}
.slot.on{background:var(--accent)}
.slot.ovr{background:var(--red)}
.bc{margin:10px 12px 0;background:var(--srf3);border:1px solid var(--hair2);border-radius:7px;padding:10px 12px;cursor:grab;position:relative}
.bc:hover{border-color:var(--ink3)}
.bc.drag{opacity:.4}
.bc .r1{display:flex;align-items:center;gap:7px;padding-right:14px}
.bc .sq{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.bc .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .meta{font-size:12px;color:var(--ink3);margin-top:3px}
.bc .meta b{font-weight:600}
.bc .conn{font-size:11.5px;color:var(--gold);font-weight:600;margin:3px 0 0;border:none;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .stage{margin-top:7px;display:flex;gap:4px}
.stg{font-size:10px;font-weight:700;letter-spacing:.04em;border:1px solid var(--hair);border-radius:4px;padding:2px 7px;color:var(--ink3);cursor:pointer;background:none}
.stg:hover{color:var(--ink)}
.stg.on{background:var(--ink);border-color:var(--ink);color:var(--srf)}
.bc .x{position:absolute;top:7px;right:8px;border:none;background:none;color:var(--ink3);cursor:pointer;font-size:12px;padding:2px;line-height:1}
.bc .x:hover{color:var(--red)}
.ghost{margin:10px 12px 0;border:1.5px dashed var(--hair);border-radius:7px;padding:14px 12px;text-align:center;font-size:11.5px;color:var(--ink3);line-height:1.5}

/* kbd bar */
.kbd{padding:8px 18px;border-top:1px solid var(--hair);background:var(--srf2);font-size:11.5px;color:var(--ink3);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.kbd b{color:var(--ink2);font-weight:650;background:var(--srf4);border-radius:3px;padding:1px 6px;font-size:10.5px}
.kbd .right{margin-left:auto;font-size:11px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(20,20,22,.5);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.on{display:flex}
.modal{background:var(--srf3);border-radius:9px;width:min(620px,92vw);max-height:80vh;display:flex;flex-direction:column;border:1px solid var(--hair);box-shadow:0 18px 50px rgba(0,0,0,.4)}
.modal .mh{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--hair2);font-weight:650;font-size:14px}
.modal .mh .btn{margin-left:auto}
.modal textarea{margin:14px 18px;flex:1;min-height:260px;border:1px solid var(--hair);border-radius:6px;padding:10px 12px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--inp);color:var(--ink);resize:none}
.modal .mf{padding:0 18px 14px;font-size:12px;color:var(--ink2)}
.toast{position:fixed;bottom:54px;left:50%;transform:translateX(-50%) translateY(8px);background:#2b2c2f;color:#e8e9ea;font-size:12.5px;font-weight:550;border-radius:6px;padding:9px 16px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* narrow screens */
.mside{display:inline-flex}
@media(max-width:900px){
  .panes,.panes.noside{grid-template-columns:1fr}
  .rz{display:none}
  .panes.noside .side.open{display:block}
  .side{display:none;position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;box-shadow:8px 0 30px rgba(0,0,0,.25)}
  .side.open{display:block}
  .det{display:none;position:fixed;right:0;top:0;bottom:0;width:min(420px,94vw);z-index:40;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
  .det.open{display:block}
  .mside{display:inline-flex}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));overflow-y:auto}
  .col{min-height:300px}
}
</style>
</head>
<body>
<div class="shell">

  <div class="top">
    <button class="btn mside" id="msideBtn">☰</button>
    <div class="t">Emmanuel's Fellowship Tracker<span id="topMeta">Cardiology · 2028</span></div>
    <div class="tabs">
      <button class="tab on" id="tabPrograms" data-tab="programs">Programs</button>
      <button class="tab" id="tabPipeline" data-tab="pipeline">Pipeline</button>
    </div>
    <input class="search" id="q" type="text" placeholder="Search programs…">
    <div class="meters">
      <div class="meter" id="sigMeter">Signals <b id="sigCount">0/20</b><span class="mbar"><i id="sigBar" style="width:0%"></i></span></div>
      <div class="meter" id="divMeter">Divisions <b id="divCount">0/3</b></div>
      <select id="theme" class="btn" title="Theme">
        <option value="paper">Paper</option>
        <option value="linen">Linen</option>
        <option value="sage">Sage</option>
        <option value="sand">Sand</option>
        <option value="slate">Slate</option>
        <option value="stone">Stone</option>
        <option value="navy">Navy</option>
        <option value="graphite">Graphite</option>
      </select>
      <button class="btn" id="exportBtn">Export</button>
    </div>
  </div>

  <div class="panes" id="panes" data-screen-label="Programs">
    <div class="side" id="side">
      <div class="sh">Views</div>
      <div id="views"></div>
      <div class="gap"></div>
      <div class="sh">ERAS divisions · pick 3</div>
      <div id="divs"></div>
      <div class="sfoot">Gold ① ② ③ = your ERAS geographic preferences (click the circle). Click a division name to filter the list.</div>
    </div>
    <div class="rz" id="rzSide" title="Drag to resize"></div>

    <div class="list" id="list" tabindex="0">
      <div class="lt">
        <span class="n" id="listCount"></span>
        <select id="fState"><option value="">State: all</option></select>
        <select id="fImg">
          <option value="">IMG: any</option><option>Strong</option><option>Moderate</option><option>Reach</option><option>Rare</option><option>Unknown</option>
        </select>
        <select id="fTier">
          <option value="">Tier: any</option><option>A</option><option>B</option><option>C</option><option>D</option>
        </select>
        <select id="sort">
          <option value="suggested">Sort: suggested</option>
          <option value="tier">Sort: tier</option>
          <option value="img">Sort: IMG read</option>
          <option value="spots">Sort: spots</option>
          <option value="name">Sort: name</option>
        </select>
        <select id="group">
          <option value="div">Group: division</option>
          <option value="state">Group: state</option>
          <option value="tier">Group: tier</option>
          <option value="none">Group: none</option>
        </select>
      </div>
      <div id="rows"></div>
    </div>
    <div class="rz" id="rzDet" title="Drag to resize"></div>

    <div class="det" id="det"></div>
  </div>

  <div class="board" id="board" data-screen-label="Pipeline"></div>

  <div class="kbd" id="kbdbar">
    <span><b>↑</b><b>↓</b> navigate</span>
    <span><b>S</b> signal</span>
    <span><b>F</b> star</span>
    <span><b>R</b> reach-out</span>
    <span class="right" id="footNote"></span>
  </div>
</div>

<div class="overlay" id="exportOverlay">
  <div class="modal">
    <div class="mh">Your list <button class="btn" id="exportClose">Close</button></div>
    <textarea id="exportTA" readonly></textarea>
    <div class="mf" id="exportNote">Copied to clipboard.</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DATA — replace only this block for monthly updates.
   Each program: name, city, state, stateName, erasRegion,
   coastTier, tier, spots, imgRead, visa, payPGY4, website,
   homeProgram, nigerianContact, namedContact, whyConsider,
   fellows, imgEvidence, programDirector, strengthsSites,
   recentPlacements, applicationNotes
   ============================================================ */
const META = {"cycle":"2028","builtFor":"Dr. Emmanuel Otabor","dataVerified":"June 2026","source":"Program websites + AMA FREIDA"};
const PROGRAMS = [
  {
    "name": "Inova Fairfax",
    "city": "Falls Church",
    "state": "VA",
    "stateName": "Virginia",
    "erasRegion": "South Atlantic",
    "coastTier": "East",
    "tier": "A",
    "spots": "~3-4",
    "imgRead": "Moderate",
    "visa": "J-1",
    "payPGY4": "~$89k",

<script>

const LS_KEY = "cft_v2";
const REGIONS = ["New England","Middle Atlantic","South Atlantic","East North Central","East South Central","West North Central","West South Central","Mountain","Pacific"];
const tierRank = {A:0,B:1,C:2,D:3};
const imgRank = {Strong:0,Moderate:1,Reach:2,Rare:3,Unknown:4};
const coastRank = {"East":0,"Inland East":1,"Central":2,"West":3};

function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
PROGRAMS.forEach(p=>p.id=slug(p.name));

/* ---- state ---- */
let state = {p:{}, picks:[], ui:{tab:"programs", view:"all", div:"", q:"", fState:"", fImg:"", fTier:"", sort:"suggested", group:"div", sel:null, theme:"paper", sideC:false, detW:false}};
try{
  const saved = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(saved && saved.p){ state.p=saved.p||{}; state.picks=saved.picks||[]; Object.assign(state.ui, saved.ui||{}); }
}catch(e){}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function st(id){ return state.p[id] || (state.p[id]={sig:false,star:false,reach:false,stage:"todo",removed:false,uTier:"",uContact:"",note:""}); }
function effTier(p){ const s=st(p.id); return s.uTier||p.tier; }
function chCls(p){ return p.imgRead==="Strong"?"cS":p.imgRead==="Moderate"?"cM":p.imgRead==="Reach"?"cR":p.imgRead==="Rare"?"cRr":"cU"; }
function hasConn(p){ const s=st(p.id); return !!(p.nigerianContact||p.namedContact||p.homeProgram||s.uContact); }
function inReach(p){ const s=st(p.id); return s.reach; }
const U = state.ui;

/* one-time: apply the kept list — programs not in KEPT start as Removed (restore any from the Removed view) */
if(!state.keptApplied && typeof KEPT!=="undefined" && KEPT.length){
  const k = new Set(KEPT);
  PROGRAMS.forEach(p=>{ if(!k.has(p.id)){ const s=st(p.id); s.removed=true; s.sig=false; s.star=false; s.reach=false; } });
  state.keptApplied = true; save();
}

/* ---- derived ---- */
function active(){ return PROGRAMS.filter(p=>!st(p.id).removed); }
function counts(){
  const a = active();
  return {
    all:a.length,
    sig:a.filter(p=>st(p.id).sig).length,
    star:a.filter(p=>st(p.id).star).length,
    reach:a.filter(p=>inReach(p)).length,
    conn:a.filter(p=>hasConn(p)).length,
    east:a.filter(p=>p.coastTier==="East").length,
    removed:PROGRAMS.length-a.length
  };
}
function visibleRows(){
  const q = U.q.toLowerCase().trim();
  let rows = PROGRAMS.filter(p=>{
    const s = st(p.id);
    if(U.view==="removed"){ if(!s.removed) return false; }
    else if(s.removed) return false;
    if(U.view==="sig" && !s.sig) return false;
    if(U.view==="star" && !s.star) return false;
    if(U.view==="reach" && !inReach(p)) return false;
    if(U.view==="conn" && !hasConn(p)) return false;
    if(U.view==="east" && p.coastTier!=="East") return false;
    if(U.div && p.erasRegion!==U.div) return false;
    if(U.fState && p.state!==U.fState) return false;
    if(U.fImg && p.imgRead!==U.fImg) return false;
    if(U.fTier && effTier(p)!==U.fTier) return false;
    if(q && !(p.name.toLowerCase().includes(q)||p.city.toLowerCase().includes(q)||p.state.toLowerCase()===q||p.stateName.toLowerCase().includes(q))) return false;
    return true;
  });
  const gk = groupKeyFn();
  function groupCmp(a,b){
    if(U.group==="div"){
      const r=g=>{const pi=state.picks.indexOf(g); return pi>-1?pi:3+REGIONS.indexOf(g);};
      return r(a)-r(b);
    }
    return String(a).localeCompare(String(b));
  }
  rows.sort((a,b)=>{
    if(gk){ const c = groupCmp(gk(a),gk(b)); if(c) return c; }
    const sa=st(a.id), sb=st(b.id);
    if(U.sort==="suggested"){
      if((sb.sig?1:0)!==(sa.sig?1:0)) return (sb.sig?1:0)-(sa.sig?1:0);
      if((sb.star?1:0)!==(sa.star?1:0)) return (sb.star?1:0)-(sa.star?1:0);
      return tierRank[effTier(a)]-tierRank[effTier(b)] || (coastRank[a.coastTier]??9)-(coastRank[b.coastTier]??9) || (imgRank[a.imgRead]??9)-(imgRank[b.imgRead]??9);
    }
    if(U.sort==="tier") return tierRank[effTier(a)]-tierRank[effTier(b)] || (imgRank[a.imgRead]??9)-(imgRank[b.imgRead]??9);
    if(U.sort==="img") return (imgRank[a.imgRead]??9)-(imgRank[b.imgRead]??9) || tierRank[effTier(a)]-tierRank[effTier(b)];
    if(U.sort==="spots"){ const n=s=>{const m=String(s).match(/\d+/);return m?+m[0]:0}; return n(b.spots)-n(a.spots); }
    return a.name.localeCompare(b.name);
  });
  return rows;
}
function groupKeyFn(){
  if(U.group==="div") return p=>p.erasRegion;
  if(U.group==="state") return p=>p.stateName;
  if(U.group==="tier") return p=>"Tier "+effTier(p);
  return null;
}

/* ---- render: topbar ---- */
function renderTop(){
  const c = counts();
  const sigEl=document.getElementById("sigMeter");
  document.getElementById("sigCount").textContent = c.sig+"/20";
  document.getElementById("sigBar").style.width = Math.min(100, c.sig/20*100)+"%";
  sigEl.classList.toggle("warn", c.sig>20);
  document.getElementById("divCount").textContent = state.picks.length+"/3";
  document.getElementById("footNote").textContent = "Data verified "+META.dataVerified+" · "+META.source+" · everything saves locally in this browser";
}

/* ---- render: sidebar ---- */
function renderSide(){
  const c = counts();
  const views = [
    ["all","All active",c.all,""],
    ["sig","Signaled",c.sig+"<small>/20</small>",c.sig>20?"warnc":""],
    ["star","Starred",c.star,""],
    ["reach","Reach-out",c.reach,""],
    ["conn","Connections",c.conn,""],
    ["east","East Coast",c.east,""],
    ["removed","Removed",c.removed,""]
  ];
  document.getElementById("views").innerHTML = views.map(([k,label,n,cls])=>
    `<button class="sv ${U.view===k?"sel":""} ${cls}" data-view="${k}">${label}<span class="c"><b>${n}</b></span></button>`).join("");
  const a = active();
  document.getElementById("divs").innerHTML = REGIONS.map(rg=>{
    const n = a.filter(p=>p.erasRegion===rg).length;
    const pi = state.picks.indexOf(rg);
    return `<button class="dv ${pi>-1?"on":""} ${U.div===rg?"flt":""}" data-div="${esc(rg)}"><span class="pickwrap" data-pick="${esc(rg)}" title="Set as one of your 3 ERAS preferences"><span class="pick">${pi>-1?pi+1:""}</span></span>${rg}<span class="c">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#views .sv").forEach(el=>el.onclick=()=>{ U.view = el.dataset.view; U.div=""; save(); renderAll(); });
  document.querySelectorAll("#divs .dv").forEach(el=>{
    el.onclick=(e)=>{
      const pw = e.target.closest("[data-pick]");
      if(pw){ togglePick(pw.dataset.pick); return; }
      U.div = (U.div===el.dataset.div ? "" : el.dataset.div); save(); renderAll();
    };
  });
}
function togglePick(rg){
  const i = state.picks.indexOf(rg);
  if(i>-1) state.picks.splice(i,1);
  else if(state.picks.length>=3){ toast("You already picked 3 divisions — remove one first."); return; }
  else state.picks.push(rg);
  save(); renderAll();
}

/* ---- render: list ---- */
function renderList(){
  const rows = visibleRows();
  if(U.sel && !rows.some(p=>p.id===U.sel)) U.sel = rows.length?rows[0].id:null;
  if(!U.sel && rows.length) U.sel = rows[0].id;
  const gk = groupKeyFn();
  let html = "", last=null;
  rows.forEach(p=>{
    if(gk){
      const g = gk(p);
      if(g!==last){ last=g;
        const cnt = rows.filter(x=>gk(x)===g).length;
        const pi = U.group==="div" ? state.picks.indexOf(g) : -1;
        html += `<div class="gh">${pi>-1?"①②③".charAt(pi)+" ":""}${esc(g)} — <b>${cnt}</b></div>`;
      }
    }
    const s = st(p.id), et = effTier(p);
    const conn = p.homeProgram ? "" : (p.nigerianContact||p.namedContact||s.uContact||"");
    html += `<div class="r ${U.sel===p.id?"sel":""} ${s.removed?"dim":""}" data-id="${p.id}">
      <span class="sq ${chCls(p)}"></span>
      <div class="main">

/* ---- render: detail ---- */

  const s = st(p.id), et = effTier(p);
  const connBits = [];
  if(p.homeProgram) connBits.push("<b>Your home program</b> — Jefferson Einstein IM residency.");
  if(p.nigerianContact) connBits.push("<b>Nigerian:</b> "+esc(p.nigerianContact));
  if(p.namedContact) connBits.push("<b>Named contact:</b> "+esc(p.namedContact));
  if(s.uContact) connBits.push("<b>Your contact:</b> "+esc(s.uContact));
  const deep = [
    ["Why consider", p.whyConsider],

    ["Program director", p.programDirector],
    ["Fellows", p.fellows],

    ${window.innerWidth<=900?'<button class="btn" id="detClose" style="float:right">✕</button>':'<button class="btn dexp" id="detWide" title="Toggle a wider detail panel">'+(U.detW?"Shrink ⇤":"Expand ⤢")+'</button>'}
    <div class="ttl">${esc(p.name)}</div>
    <div class="sub">${esc(p.city)}, ${esc(p.stateName)} · ${esc(p.erasRegion)} · ${esc(p.coastTier)} Coast tier · <a href="${esc(p.website||("https://www.google.com/search?q="+encodeURIComponent(p.name+" cardiology fellowship")))}" target="_blank" rel="noopener">Fellowship site ↗</a></div>
    <div class="dacts">
      <button class="da ${s.sig?"sigon":""}" id="aSig">${s.sig?"Signaled ✓":"Signal"}</button>
      <button class="da ${s.star?"staron":""}" id="aStar">${s.star?"★ Starred":"☆ Star"}</button>
      <button class="da ${s.reach?"reachon":""}" id="aReach">${s.reach?"Reach out ✓":"Reach out"}</button>
      <button class="da ${s.removed?"rest":"rm"}" id="aRm">${s.removed?"Restore":"Remove"}</button>
    </div>
    <div class="facts">
      <div class="fa"><div class="k">Tier${s.uTier?'<span class="yours">YOURS</span>':""}</div><div class="v"><select id="aTier">${["A","B","C","D"].map(t=>`<option ${et===t?"selected":""}>${t}</option>`).join("")}</select></div></div>
      <div class="fa"><div class="k">IMG read</div><div class="v" style="color:var(--im${p.imgRead==="Strong"?"S":p.imgRead==="Moderate"?"M":p.imgRead==="Reach"?"R":p.imgRead==="Rare"?"Rr":"U"})">${esc(p.imgRead)}</div></div>
      <div class="fa"><div class="k">Spots / yr</div><div class="v">${esc(p.spots||"—")}</div></div>
      <div class="fa"><div class="k">Pay PGY-4</div><div class="v">${esc(p.payPGY4||"—")}</div></div>
      <div class="fa"><div class="k">Visa</div><div class="v mut">${esc(p.visa||"—")} <small>(info only — you're work-authorized)</small></div></div>
      <div class="fa"><div class="k">Division</div><div class="v mut">${esc(p.erasRegion)}${state.picks.indexOf(p.erasRegion)>-1?' <span class="yours">✓ PICK '+(state.picks.indexOf(p.erasRegion)+1)+'</span>':""}</div></div>
    </div>
    ${connBits.length?`<div class="conn"><div class="k">Your connection</div><div class="v">${connBits.join("<br>")}</div></div>`:""}

    <div class="field"><div class="k">My contact at this program <span class="saved" id="cSaved">SAVED</span></div>

    <div class="field"><div class="k">My notes <span class="saved" id="nSaved">SAVED</span></div>
      <textarea id="aNote" placeholder="Who you contacted, impressions, deadlines…">${esc(s.note)}</textarea></div>
  `;
  const sel=()=>{save(); renderAll();};

  document.getElementById("aStar").onclick=()=>{ s.star=!s.star; sel(); };
  document.getElementById("aReach").onclick=()=>{ s.reach=!s.reach; if(s.reach&&!s.stage) s.stage="todo"; sel(); };
  document.getElementById("aRm").onclick=()=>{ s.removed=!s.removed; if(s.removed){s.sig=false;s.star=false;s.reach=false;} sel(); };

/* ---- render: board ---- */
function renderBoard(){
  const board = document.getElementById("board");
  if(U.tab!=="pipeline"){ board.classList.remove("on"); document.getElementById("panes").style.display=""; return; }
  board.classList.add("on"); document.getElementById("panes").style.display="none";
  const a = active();
  const watch = a.filter(p=>st(p.id).star && !st(p.id).sig);
  const ballot = a.filter(p=>st(p.id).sig).sort((x,y)=>tierRank[effTier(x)]-tierRank[effTier(y)]);
  const outr = a.filter(p=>inReach(p) && st(p.id).stage!=="replied");
  const replied = a.filter(p=>inReach(p) && st(p.id).stage==="replied");
  const card = (p, col)=>{
    const s = st(p.id);
    const conn = p.homeProgram ? "Home program"+(p.nigerianContact?" · "+p.nigerianContact:"") : (p.nigerianContact||p.namedContact||s.uContact||"");
    return `<div class="bc" draggable="true" data-id="${p.id}" data-col="${col}">
      <button class="x" title="Remove from this column" data-x="${col}">✕</button>
      <div class="r1"><span class="sq ${chCls(p)}"></span><span class="nm">${esc(p.name)}</span></div>
      <div class="meta">${esc(p.city)}, ${esc(p.state)} · <b style="color:var(--im${p.imgRead==="Strong"?"S":p.imgRead==="Moderate"?"M":p.imgRead==="Reach"?"R":p.imgRead==="Rare"?"Rr":"U"})">${esc(p.imgRead)}</b> · ${esc(p.spots||"—")} spots</div>
      ${conn?`<div class="conn">${esc(String(conn).split(";")[0])}</div>`:""}
      ${col==="outr"||col==="replied"?`<div class="stage">
        <button class="stg ${s.stage==="todo"?"on":""}" data-stg="todo">To contact</button>
        <button class="stg ${s.stage==="contacted"?"on":""}" data-stg="contacted">Contacted</button>
        <button class="stg ${s.stage==="replied"?"on":""}" data-stg="replied">Replied</button>
      </div>`:""}
    </div>`;
  };
  const sigN = ballot.length;
  const slots = Array.from({length:Math.max(20,sigN)},(_,i)=>`<i class="slot ${i<sigN?(i>=20?"on ovr":"on"):""}"></i>`).join("");
  board.innerHTML = `
    <div class="col" data-drop="watch">
      <div class="colh">Watchlist <span class="c">${watch.length}</span></div>
      <div class="colbody">${watch.map(p=>card(p,"watch")).join("")||'<div class="ghost">Star programs (in the Programs tab, or drag a card here) to build a watchlist of candidates you\u2019re weighing.</div>'}
      ${watch.length?'<div class="ghost">Drag here to star</div>':""}</div>
    </div>
    <div class="col" data-drop="ballot">
      <div class="colh ballot ${sigN>20?"warn":""}">Signal ballot <span class="c"><b>${sigN}</b>/20</span></div>
      <div class="colbody"><div class="bslots">${sigN>20?'<span style="color:var(--red);font-weight:700">'+(sigN-20)+" over the limit</span>":(20-sigN)+" signals left"}<div class="slotbar">${slots}</div></div>
      ${ballot.map(p=>card(p,"ballot")).join("")}
      <div class="ghost">Drag a program here to spend a signal</div></div>
    </div>
    <div class="col" data-drop="outr">
      <div class="colh">Outreach <span class="c">${outr.length}</span></div>
      <div class="colbody">${outr.map(p=>card(p,"outr")).join("")||'<div class="ghost">Flag \u201cReach out\u201d on a program (or drag a card here) to build your outreach queue.</div>'}
      ${outr.length?'<div class="ghost">Drag here to add to outreach</div>':""}</div>
    </div>
    <div class="col" data-drop="replied">
      <div class="colh">Replied <span class="c">${replied.length}</span></div>
      <div class="colbody">${replied.map(p=>card(p,"replied")).join("")||'<div class="ghost">Cards land here when you mark an outreach contact as \u201cReplied\u201d.</div>'}</div>
    </div>`;
  board.querySelectorAll(".bc").forEach(el=>{
    el.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain", el.dataset.id); el.classList.add("drag"); });
    el.addEventListener("dragend",()=>el.classList.remove("drag"));
    el.addEventListener("click",e=>{
      if(e.target.dataset.stg){ st(el.dataset.id).stage = e.target.dataset.stg; save(); renderAll(); return; }
      if(e.target.dataset.x){
        const s = st(el.dataset.id), c = e.target.dataset.x;
        if(c==="watch") s.star=false; else if(c==="ballot") s.sig=false; else { s.reach=false; s.stage="todo"; }
        save(); renderAll(); return;
      }
      U.tab="programs"; U.sel=el.dataset.id; save(); renderAll();
      if(window.innerWidth<=900) document.getElementById("det").classList.add("open");
    });
  });
  board.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{
      e.preventDefault(); col.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain"); if(!id) return;
      const s = st(id), d = col.dataset.drop;
      if(d==="watch"){ s.star=true; s.sig=false; }
      if(d==="ballot"){ s.sig=true; if(counts().sig>20) toast("That's more than 20 signals — ERAS only gives you 20."); }
      if(d==="outr"){ s.reach=true; if(s.stage==="replied") s.stage="todo"; }
      if(d==="replied"){ s.reach=true; s.stage="replied"; }
      save(); renderAll();
    });
  });
}

function applyPanes(){
  const panes=document.getElementById("panes");
  panes.classList.toggle("noside", !!U.sideC);
  const avail = Math.min(window.innerWidth,1500);
  let ws = Math.max(150, Math.min(U.wSide||200, 360));
  let dw = U.detW ? Math.max(U.wDet||390,560) : (U.wDet||390);
  dw = Math.max(280, Math.min(dw, avail - (U.sideC?0:ws+6) - 272));
  panes.style.setProperty("--w-side",ws+"px");
  panes.style.setProperty("--w-det",dw+"px");
}
window.addEventListener("resize",applyPanes);
/* drag-to-resize pane dividers */
let rzDrag=null;
document.getElementById("rzSide").addEventListener("mousedown",e=>{ rzDrag={t:"side",x:e.clientX,w:U.wSide||200}; e.preventDefault(); });
document.getElementById("rzDet").addEventListener("mousedown",e=>{ rzDrag={t:"det",x:e.clientX,w:(U.detW?Math.max(U.wDet||390,560):(U.wDet||390))}; e.preventDefault(); });
document.addEventListener("mousemove",e=>{
  if(!rzDrag) return;
  if(rzDrag.t==="side"){ U.wSide=Math.round(Math.max(150,Math.min(360,rzDrag.w+(e.clientX-rzDrag.x)))); }
  else { U.detW=false; U.wDet=Math.round(Math.max(280,Math.min(760,rzDrag.w-(e.clientX-rzDrag.x)))); }
  applyPanes();
});
document.addEventListener("mouseup",()=>{ if(rzDrag){ rzDrag=null; save(); } });

/* ---- keyboard ---- */
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
  if(U.tab!=="programs") return;
  const rows = visibleRows();
  if(!rows.length) return;
  const i = rows.findIndex(p=>p.id===U.sel);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    const ni = e.key==="ArrowDown" ? Math.min(rows.length-1, i+1) : Math.max(0, i-1);
    U.sel = rows[ni].id; save(); renderList(); renderDetail();
    const el = document.querySelector(`#rows .r[data-id="${U.sel}"]`);
    if(el){ const list=document.getElementById("list"); const r=el.getBoundingClientRect(), l=list.getBoundingClientRect();
      if(r.bottom>l.bottom) list.scrollTop += r.bottom-l.bottom+8;
      if(r.top<l.top+44) list.scrollTop -= (l.top+44)-r.top+8; }
    return;
  }
  const p = rows[i>=0?i:0]; if(!p) return;
  const s = st(p.id);
  const k = e.key.toLowerCase();
  if(k==="s"){ s.sig=!s.sig; if(s.sig&&counts().sig>20) toast("That's more than 20 signals — ERAS only gives you 20."); save(); renderAll(); }
  if(k==="f"){ s.star=!s.star; save(); renderAll(); }
  if(k==="r"){ s.reach=!s.reach; save(); renderAll(); }
});

/* ---- boot ---- */
function renderAll(){ renderTabs(); applyPanes(); renderTop(); renderSide(); renderList(); renderDetail(); renderBoard(); }
/* Live-data loader: on every page load, fetch the newest programs.json (cache-busted).
   Falls back to the data embedded above when opened offline or as a local file. */
function __boot(){ try{ PROGRAMS.forEach(p=>p.id=slug(p.name)); }catch(e){} renderAll(); }
(function(){
  try{
    fetch("programs.json?t="+Date.now(), {cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(data){
        if(Array.isArray(data) && data.length){ PROGRAMS.length=0; for(var i=0;i<data.length;i++) PROGRAMS.push(data[i]); }
      })
      .catch(function(){})
      .finally(__boot);
  }catch(e){ __boot(); }
})();
</script>
